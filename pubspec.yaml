name: park_locator
description: "ParkRoute - Never lose your parking spot again."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Location
  geolocator: ^13.0.2
  geocoding: ^5.0.1

  # Maps
  # Image
  image_picker: ^1.1.2

  # Storage
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_compass: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
